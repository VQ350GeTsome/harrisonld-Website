<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saving/Investing Simulation</title>
    
    <link rel="stylesheet" href="eseistyle.css">
    <script src="esei.js" defer></script>

</head>

<!-- Contribution Settings --> 

<br><hr class="hf-ln">            
<h3>Contribution Settings ...</h3>

<label for="lump-sum">Lump-sum Amount:&nbsp;</label>
<input type="number" id="lump-sum" step="any" min="0" value="1000">

<br><br>

<label for="contri-freq">Contribution Frequency:&nbsp;</label>
<select id="contri-freq">  
    <option value="252">Daily</option>
    <option value="52" selected>Weekly</option>
    <option value="26">Biweekly</option>
    <option value="12">Monthly</option>
    <option value="6">Bimonthly</option>
    <option value="4">Quarterly</option>
    <option value="2">Biquarterly</option>
    <option value="1">Yearly</option>
</select>

<br><br>

<label for="contri-amount">Contribution Amount:&nbsp;</label>
<input type="number" id="contri-amount" step="any" min="0" value="125">

<!-- Market Return Settings --> 

<br><br><hr class="hf-ln">            
<h3>Market Return Settings ...</h3>

<label for="preset-returns">Presets:&nbsp;</label>
<select id="preset-returns">
    <option value="">Manual</option>
    <option value="SPY" selected>S&P500</option>
    <option value="QQQ">NASDAQ 100</option>
</select>

<br><br>

<label for="cagr">Average Growth %:&nbsp;</label>
<input type="number" id="cagr" class="marketInputs" step="any" min="0" value="9.60">

<br><br>

<label for="volatility">Risk / Volatility %:&nbsp;</label>
<input type="number" id="volatility" class="marketInputs" step="any" min="0" value="17.50" max="100">

<!-- Savings Return Settings --> 

<br><br><hr class="hf-ln">          
<h3>Savings Return Settings ...</h3>

<label for="interest">Average Interest %:&nbsp;</label>
<input type="number" id="interest" step="any" min="0" value="3.15">

<!-- Simulation Settings --> 

<br><br><hr class="hf-ln">          
<h3>Simulation Settings ...</h3>

<label for="iterations">Monte Carlo Iterations:&nbsp;</label>
<input type="number" id="iterations" step="any" min="5" value="1000">

<br><br>

<label for="years">Years to Simulate:&nbsp;</label>
<input type="number" id="years" step="any" min="0" max="100" value="15">

<br><br>

<label for="logspace">Transform to Logspace?&nbsp;</label>
<input type="checkbox" id="logspace">

<br><br>

<label for="savings-subtract">Plot Excess Return Over Savings?&nbsp;</label>
<input type="checkbox" id="savings-subtract">

<br><br>

<label>Run Monte Carlo:&nbsp;</label>
<button id="run-button" class="wide-button"> Start! </button>

<!-- Charts --> 

<br><br><hr class="hf-ln">  

<label for="price-chart-container"><h3>Simulated Values ...</h3></label>
<div id="price-chart-container" style="position: relative; width: 66%; height: 33vh; min-height: 0; min-width: 0; margin-left: 0; margin-right: auto;">
    <canvas id="simChart" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: 2px solid #000; background: #ffffff;"></canvas>
</div>

<br>

<label for="percent-chart-container"><h3>% of Simulations > Savings ...</h3></label>
<div id="percent-chart-container" style="position: relative; width: 66%; height: 33vh; min-height: 0; min-width: 0; margin-left: 0; margin-right: auto;">
    <canvas id="percentChart" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: 2px solid #000; background: #ffffff;"></canvas>
</div>
